name: Check ReaPack package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reapack-index:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repository
        uses: actions/checkout@v6
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -yy pandoc
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install reapack-index
        run: gem install reapack-index
      - name: Validate package metadata
        run: reapack-index --check
